<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 🚫 앱 화면과 같은 이유로 번역 제안을 끕니다 (nodes/english/ui/Index.html 참고) -->
<meta name="google" content="notranslate">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<!-- 🍎 홈 화면에 추가해서 「창으로 열기」로 켤 때(standalone) 쓰는 값들 (2026-09-10).
     ⚠️ 이걸 안 적어 두면 아이폰·아이패드가 켜지는 동안 **까만 화면**을 보여 줍니다.
        (기기가 어두운 모드면 검정으로 칠해 버립니다 — 실제로 겪음)
     color-scheme 을 light 로 못 박아 시작 화면도 흰색이 되게 합니다. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영어 지문 학습소">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<!-- 🏠 홈 화면에 추가할 때 쓰는 아이콘.
     ⚠️ 아이콘 그림이 없으면 iOS 가 그때 화면을 찍어 아이콘으로 씁니다 —
        아직 안 뜬 상태였으면 텅 빈 아이콘이 박힙니다.
     ⚠️ manifest 는 넣지 마세요 (2026-09-10 에 넣었다가 도로 뺌).
        manifest 에 start_url 이 있으면 홈 화면에 추가할 때 iOS 가 **지금 보고 있는
        주소 대신 그 주소**를 씁니다. 그러면 교무실 주소의 ?page=teacher&k=… 가
        날아가고 학생 화면으로 들어가 버립니다 — 실제로 겪음. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<!-- ⚡ 앱을 부르기 전에 구글과 미리 손을 잡아 둡니다 (이름 찾기·암호 인사).
     아래 script 가 iframe 주소를 정하기 전에 브라우저가 그 준비를 먼저 시작합니다.
     ⚠️ 앱 내용이 실제로 오는 …-script.googleusercontent.com 은 주소가 그때그때
        달라서 미리 잡아 둘 수 없습니다 — 여기 적어도 소용이 없습니다. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<title>영어 지문 학습소</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#fff; color-scheme:light; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; }
  /* 앱이 뜨기 전 잠깐 보이는 화면 (뜨고 나면 iframe 이 덮습니다) */
  .wait { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          font:16px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif; color:#8a8a8a; }
  /* 🆘 오래 걸리거나 아예 안 열릴 때 보여 주는 안내 (iframe 위에 덮습니다) */
  #help { position:fixed; inset:0; z-index:9; display:none; background:#fff;
          align-items:center; justify-content:center; padding:24px;
          font:16px/1.7 -apple-system, "Apple SD Gothic Neo", sans-serif; color:#333; }
  #help.on { display:flex; }
  #help .box { max-width:420px; width:100%; text-align:center; }
  #help h2 { font-size:1.15rem; margin:14px 0 6px; }
  #help p { color:#777; font-size:.95rem; margin:0 0 18px; }
  #help a.go { display:block; padding:15px 18px; border-radius:14px; text-decoration:none;
               background:#7bd3ae; color:#1d3b31; font-weight:700; }
  #help button { margin-top:12px; background:none; border:0; color:#999;
                 font-size:.9rem; text-decoration:underline; cursor:pointer; }
</style>
</head>
<body translate="no">

<!--
  ┌─────────────────────────────────────────────────────────────┐
  │ 이 파일이 하는 일: 앱스 스크립트 웹앱을 통째로 감싸기        │
  └─────────────────────────────────────────────────────────────┘

  앱스 스크립트 주소로 바로 들어가면 맨 위에 구글이 파란 배너
  (“이 애플리케이션은 Google Apps Script 사용자가 만들었습니다”)를
  강제로 붙입니다. 그 배너는 구글이 만든 바깥 틀에 있어서
  우리 HTML 에서는 손이 닿지 않습니다.

  그래서 우리 페이지를 하나 만들어 웹앱을 iframe 으로 띄웁니다.
  이렇게 감싸면 배너가 붙지 않습니다.

  ⚠️ 함께 지켜야 하는 것 두 가지
   1) 웹앱 쪽 doGet 에 .setXFrameOptionsMode(ALLOWALL) 이 있어야 합니다.
      (core/web/Core_Web.js — 이미 들어 있습니다)
   2) 앱 쪽 화면에 Core_Embed 조각이 들어 있어야 합니다.
      앱 안의 링크(target="_top")를 그대로 두면 이 껍데기까지 통째로 날아가
      배너가 다시 보이기 때문에, Core_Embed 가 그 클릭을 가로채
      "이 주소로 바꿔 달라"고 이 페이지에 알려 줍니다. 아래 리스너가 그것을 받습니다.
-->

<div class="wait">여는 중…</div>

<!-- 🆘 안 열릴 때 빠져나가는 문. 아래 script 가 때가 되면 보여 줍니다.
     ⚠️ 아이패드·아이폰 사파리는 이 껍데기 안쪽(구글 화면)을 막아 버리는 일이 있습니다.
        그때는 여기 링크로 구글 주소를 직접 열면 됩니다 (파란 배너가 보이지만 기능은 같습니다). -->
<div id="help">
  <div class="box">
    <div style="font-size:44px">🌱</div>
    <h2>화면이 안 열리나요?</h2>
    <p>이 기기에서는 감싼 화면이 막혀 있을 수 있어요.<br>아래를 누르면 바로 들어갑니다.</p>
    <a class="go" id="helpGo" href="#" target="_top">바로 들어가기</a>
    <button type="button" id="helpWait">조금 더 기다릴게요</button>
  </div>
</div>
<iframe id="app" title="영어 지문 학습소"
        allow="clipboard-write; fullscreen"
        referrerpolicy="no-referrer"></iframe>

<noscript>
  <p style="font:16px sans-serif;padding:24px">
    자바스크립트가 꺼져 있습니다.
    <a href="https://script.google.com/macros/s/AKfycbx1yj34es_vLQ2LMLWShP_WYg1mQ6H_dcEufekZOl9GTPOXG_50U2xsiharyt7BpZAI8w/exec">여기를 눌러</a>
    바로 들어가세요.
  </p>
</noscript>

<script>
  // 운영계 주소 (nodes/english/node.env 의 PROD_ID 와 같아야 합니다)
  var EXEC = 'https://script.google.com/macros/s/AKfycbx1yj34es_vLQ2LMLWShP_WYg1mQ6H_dcEufekZOl9GTPOXG_50U2xsiharyt7BpZAI8w/exec';

  // 🪟 "이건 껍데기 안에서 여는 것" 이라고 앱에게 알려 주는 표시.
  //    앱(Core_Embed)은 이 표시가 있을 때만 링크를 가로채 이쪽으로 넘깁니다.
  //    ⚠️ 창이 몇 겹인지로 알아내게 두면 개발계 주소(/dev)에서 링크가 먹통이 됩니다.
  function withEmbed(u) {
    var hash = '', i = u.indexOf('#');
    if (i >= 0) { hash = u.slice(i); u = u.slice(0, i); }
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'embed=1' + hash;
  }

  // 🚪 지난번에 들어간 문 기억하기 (2026-09-09)
  //
  //   앱스 스크립트는 한 번 여는 데 1초 넘게 걸립니다. 그런데 학생은 늘
  //   첫 화면(문 고르기)을 한 번 열고 → 학생 문을 눌러 또 한 번 열었습니다.
  //   같은 기기에서 지난번에 학생 문으로 들어갔다면, 다음부터는 그 화면을
  //   곧바로 엽니다. 왕복이 한 번 줄어 그만큼 빨리 뜹니다.
  //
  //   ⚠️ 교무실은 기억하지 않습니다 — 기억하려면 열쇠(k)까지 이 기기에
  //      적어 두어야 하는데, 교실 컴퓨터에 열쇠를 남기면 안 됩니다.
  //      교무실 전용 주소에는 이미 ?page=teacher 가 붙어 있어 원래 한 번에 열립니다.
  //   ⚠️ 첫 화면으로 나가면(「🏠 처음으로」) 기억을 지웁니다. 그래야 학생 화면에
  //      갇히지 않고 다음번에 다시 문을 고를 수 있습니다.
  var DOOR = 'engGoDoor';

  function readDoor() {
    try { return localStorage.getItem(DOOR) || ''; } catch (e) { return ''; }
  }
  function rememberDoor(tail) {
    var m = /[?&]page=([A-Za-z]+)/.exec(String(tail || ''));
    var page = m ? m[1] : '';
    try {
      if (page === 'student') localStorage.setItem(DOOR, 'student');
      else localStorage.removeItem(DOOR);        // 첫 화면·교무실은 기억하지 않음
    } catch (e) {}
  }

  // 이 껍데기 주소 뒤에 붙은 것(?page=teacher&k=… 등)을 그대로 넘겨 줍니다.
  // 그래야 예전 주소 뒤에 붙이던 것들이 새 주소에서도 똑같이 통합니다.
  var app = document.getElementById('app');
  var search = window.location.search;
  // 주소에 어느 문인지 안 적혀 있을 때만 기억한 문을 씁니다.
  // (주소창은 그대로 둡니다 — 학생이 북마크한 주소는 껍데기 주소 그대로여야 합니다)
  if (!/[?&]page=/.test(search) && readDoor() === 'student') {
    search = (search ? search + '&' : '?') + 'page=student';
  }

  /* 🚪 열쇠가 빠진 교무실 주소는 첫 화면으로 (2026-09-10)
     열쇠(k)가 없는 ?page=teacher 는 앱이 첫 화면을 보여 주기로 되어 있는데,
     실제로는 하얀 화면에서 멈추는 것을 확인했습니다(재현됨).
     그래서 껍데기가 미리 page=teacher 를 떼고 첫 화면을 부릅니다.
     ⚠️ 「교무실이 있다」는 티가 나면 안 되므로, 안내 문구를 띄우지 않고 조용히 첫 화면으로 보냅니다. */
  if (/[?&]page=teacher(&|$)/.test(search) && !/[?&]k=/.test(search)) {
    search = search.replace(/([?&])page=teacher(&|$)/, '$1').replace(/[?&]$/, '');
    if (search === '?') search = '';
  }

  /* 🆘 안 열릴 때 빠져나가는 문 (2026-09-10)
     앱이 다 뜨면 Core_Embed 가 {engGoReady:1} 을 보내 줍니다.
     그 신호가 WAIT_MS 안에 안 오면 「바로 들어가기」 안내를 띄웁니다.
     ⚠️ iframe 의 onload 로는 판단할 수 없습니다 — 구글이 겉껍질을 먼저 주기 때문에
        알맹이가 아직 하얀 상태여도 onload 는 이미 끝나 있습니다(실제로 확인). */
  /* 🍎 「창으로 열기」로 켠 것인가 (홈 화면 아이콘 · 주소창 없는 창)
        주소창이 없으니 안 열려도 사람이 손쓸 방법이 없습니다.
        그래서 이 경우에는 안내를 띄우는 대신 **저절로** 껍데기를 벗고 들어갑니다.
        (구글 파란 띠가 보이지만, 까만 화면에 갇히는 것보다 낫습니다) */
  var STANDALONE = (window.navigator.standalone === true) ||
                   !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  var WAIT_MS = STANDALONE ? 6000 : 9000;
  var helpEl = document.getElementById('help');
  var helpTimer = null;

  var lastUrl = '';                            // 지금 iframe 이 보고 있는 앱 주소 (embed=1 없이)
  function directUrl() {                       // 껍데기를 벗은 구글 주소 (배너는 보이지만 확실히 열립니다)
    return lastUrl || (EXEC + search + window.location.hash);
  }
  function showHelp() {
    if (STANDALONE) {                          // 주소창이 없는 창 — 사람 손을 기다리지 않습니다
      window.location.replace(directUrl());
      return;
    }
    document.getElementById('helpGo').href = directUrl();
    helpEl.classList.add('on');
  }
  function armHelp() {
    if (helpTimer) clearTimeout(helpTimer);
    helpEl.classList.remove('on');
    helpTimer = setTimeout(showHelp, WAIT_MS);
  }
  function ready() {
    if (helpTimer) { clearTimeout(helpTimer); helpTimer = null; }
    helpEl.classList.remove('on');
  }
  document.getElementById('helpWait').addEventListener('click', function () {
    helpEl.classList.remove('on');
    armHelp();                                  // 한 번 더 기다려 봅니다
  });

  function openApp(url) {                      // url 은 embed=1 을 안 붙인 앱 주소
    lastUrl = url;
    armHelp();
    app.src = withEmbed(url);
  }

  openApp(EXEC + search + window.location.hash);

  // 앱 안에서 링크를 누르면 Core_Embed 가 여기로 알려 줍니다.
  // iframe 은 우리 것이라 우리가 바꿀 수 있습니다 (앱이 직접 바꾸는 건 브라우저가 막습니다).
  window.addEventListener('message', function (ev) {
    // 보낸 곳 확인 — 앱 화면은 랜덤한 googleusercontent.com 주소라 끝만 봅니다.
    var from = String(ev.origin || '');
    if (!/\.googleusercontent\.com$/.test(from)) return;

    if (ev.data && ev.data.engGoReady) { ready(); return; }          // 🟢 다 떴다는 신호

    var url = ev.data && ev.data.engGo;
    if (typeof url !== 'string' || url.indexOf(EXEC) !== 0) return;   // 우리 앱 주소만

    openApp(url);

    // 껍데기 주소창도 맞춰 둡니다. 새로고침해도 같은 자리로 돌아옵니다.
    // (여기엔 embed=1 을 안 붙입니다 — 사람이 보는 주소는 깔끔해야 하고,
    //  새로고침하면 위에서 다시 붙습니다)
    var tail = url.slice(EXEC.length);
    rememberDoor(tail);
    try { history.replaceState(null, '', window.location.pathname + tail); } catch (e) {}
  });
</script>

</body>
</html>
